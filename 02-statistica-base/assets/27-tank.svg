<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 360" width="1000" height="360" font-family="Inter, system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">
<rect width="1000" height="360" fill="#FFFFFF"/>
<text x="40" y="34" font-size="16" font-weight="700" fill="#232A28">Cinque numeri di serie contro l'ipotesi &#8220;ne producono 500&#8221;</text>
<line x1="110" y1="170" x2="900" y2="170" stroke="#C3C9C4" stroke-width="2"/>
<line x1="110.0" y1="165" x2="110.0" y2="175" stroke="#C3C9C4" stroke-width="1.6"/>
<text x="110.0" y="194" text-anchor="middle" font-size="12" fill="#6B7671">0</text>
<line x1="261.9" y1="165" x2="261.9" y2="175" stroke="#C3C9C4" stroke-width="1.6"/>
<text x="261.9" y="194" text-anchor="middle" font-size="12" fill="#6B7671">100</text>
<line x1="413.8" y1="165" x2="413.8" y2="175" stroke="#C3C9C4" stroke-width="1.6"/>
<text x="413.8" y="194" text-anchor="middle" font-size="12" fill="#6B7671">200</text>
<line x1="565.8" y1="165" x2="565.8" y2="175" stroke="#C3C9C4" stroke-width="1.6"/>
<text x="565.8" y="194" text-anchor="middle" font-size="12" fill="#6B7671">300</text>
<line x1="717.7" y1="165" x2="717.7" y2="175" stroke="#C3C9C4" stroke-width="1.6"/>
<text x="717.7" y="194" text-anchor="middle" font-size="12" fill="#6B7671">400</text>
<line x1="869.6" y1="165" x2="869.6" y2="175" stroke="#C3C9C4" stroke-width="1.6"/>
<text x="869.6" y="194" text-anchor="middle" font-size="12" fill="#6B7671">500</text>
<line x1="125.2" y1="150" x2="125.2" y2="190" stroke="#2F6BD8" stroke-width="3"/>
<line x1="163.2" y1="150" x2="163.2" y2="190" stroke="#2F6BD8" stroke-width="3"/>
<line x1="178.4" y1="150" x2="178.4" y2="190" stroke="#2F6BD8" stroke-width="3"/>
<line x1="216.3" y1="150" x2="216.3" y2="190" stroke="#2F6BD8" stroke-width="3"/>
<line x1="337.9" y1="150" x2="337.9" y2="190" stroke="#B4341F" stroke-width="3"/>
<text x="337.9" y="140" text-anchor="middle" font-size="14" font-weight="700" fill="#B4341F">T = 150</text>
<text x="337.9" y="120" text-anchor="middle" font-size="12.5" fill="#6B7671">il massimo osservato</text>
<text x="167.7" y="216" text-anchor="middle" font-size="12.5" font-weight="700" fill="#2F6BD8">i 5 numeri di serie visti</text>
<line x1="869.6" y1="100" x2="869.6" y2="178" stroke="#C2571A" stroke-width="2"/>
<text x="869.6" y="92" text-anchor="middle" font-size="14" font-weight="700" fill="#C2571A">H&#8320;: N = 500</text>
<line x1="743.0" y1="124" x2="743.0" y2="162" stroke="#C2571A" stroke-width="2" stroke-dasharray="4 3"/>
<text x="743.0" y="116" text-anchor="middle" font-size="13" font-weight="700" fill="#C2571A">massimo atteso &#8776; 417</text>
<line x1="345.9" y1="242" x2="735.0" y2="242" stroke="#B4341F" stroke-width="2"/>
<path d="M337.9,242 l9,-5 l0,10 Z" fill="#B4341F"/>
<path d="M743.0,242 l-9,-5 l0,10 Z" fill="#B4341F"/>
<text x="540.4" y="264" text-anchor="middle" font-size="13.5" font-weight="700" fill="#B4341F">troppo lontano: se davvero ne producessero 500,</text>
<text x="540.4" y="284" text-anchor="middle" font-size="13.5" font-weight="700" fill="#B4341F">vedere un massimo di 150 capiterebbe 2 volte su 1000</text>
<text x="40" y="344" font-size="13.5" fill="#6B7671">Stima della produzione dal solo massimo: N &#8776; T &#183; (n+1)/n = 150 &#183; 6/5 = 180.</text>
</svg>
