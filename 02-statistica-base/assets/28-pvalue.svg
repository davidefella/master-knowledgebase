<text x="524.6" y="162" text-anchor="middle" font-size="13" font-weight="700" fill="#C2571A">soglia 5% &#8776; 280</text>
<text x="428.4" y="248" text-anchor="middle" font-size="12.5" fill="#C2571A">zona di rifiuto</text>
<text x="731.9" y="138" text-anchor="middle" font-size="13" font-weight="700" fill="#232A28">qui cadrebbe di solito</text>
<text x="731.9" y="156" text-anchor="middle" font-size="12.5" fill="#6B7671">se H&#8320; fosse vera</text>
<line x1="731.9" y1="166" x2="731.9" y2="192.4" stroke="#6B7671" stroke-width="1.2"/>
<text x="40" y="362" font-size="13.5" fill="#6B7671">p-value = probabilit&#224; di osservare un risultato estremo come il mio, o pi&#249;, ammesso che H&#8320; sia vera.</text>
<text x="40" y="384" font-size="13.5" fill="#6B7671">Piccolo &#8594; i dati mal si conciliano con H&#8320;. Non dice quanto H&#8320; sia probabile: dice quanto i dati sorprendono.</text>
