<text x="332.1" y="122" text-anchor="middle" font-size="13.5" font-weight="700" fill="#B4341F">misurato T = 150</text>
<text x="235.9" y="284" text-anchor="middle" font-size="13" font-weight="700" fill="#B4341F">p = 0,23%</text>
