<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 340" width="1000" height="340" font-family="Inter, system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">
<rect width="1000" height="340" fill="#FFFFFF"/>
<text x="40" y="34" font-size="16" font-weight="700" fill="#232A28">Il ciclo bayesiano: la risposta di oggi &#232; il punto di partenza di domani</text>
<rect x="90" y="90" width="210" height="96" rx="8" fill="#22874C" fill-opacity="0.08" stroke="#22874C" stroke-width="2"/>
<text x="195.0" y="116" text-anchor="middle" font-size="14" font-weight="700" fill="#22874C">prior</text>
<text x="195.0" y="142" text-anchor="middle" font-size="15" font-weight="700" fill="#232A28">P(H&#7522;)</text>
<text x="195.0" y="162" text-anchor="middle" font-size="12.5" fill="#6B7671">quello che credevo</text>
<text x="195.0" y="179" text-anchor="middle" font-size="12.5" fill="#6B7671">prima di guardare</text>
<rect x="368" y="90" width="210" height="96" rx="8" fill="#2F6BD8" fill-opacity="0.08" stroke="#2F6BD8" stroke-width="2"/>
<text x="473.0" y="116" text-anchor="middle" font-size="14" font-weight="700" fill="#2F6BD8">likelihood</text>
<text x="473.0" y="142" text-anchor="middle" font-size="15" font-weight="700" fill="#232A28">P(E | H&#7522;)</text>
<text x="473.0" y="162" text-anchor="middle" font-size="12.5" fill="#6B7671">quanto l'osservazione</text>
<text x="473.0" y="179" text-anchor="middle" font-size="12.5" fill="#6B7671">torna con ogni ipotesi</text>
<rect x="646" y="90" width="210" height="96" rx="8" fill="#C2571A" fill-opacity="0.08" stroke="#C2571A" stroke-width="2"/>
<text x="751.0" y="116" text-anchor="middle" font-size="14" font-weight="700" fill="#C2571A">posterior</text>
<text x="751.0" y="142" text-anchor="middle" font-size="15" font-weight="700" fill="#232A28">P(H&#7522; | E)</text>
<text x="751.0" y="162" text-anchor="middle" font-size="12.5" fill="#6B7671">quello che credo</text>
<text x="751.0" y="179" text-anchor="middle" font-size="12.5" fill="#6B7671">dopo aver guardato</text>
<line x1="310" y1="138.0" x2="350" y2="138.0" stroke="#6B7671" stroke-width="2"/>
<path d="M358,138.0 l-9,-5 l0,10 Z" fill="#6B7671"/>
<line x1="588" y1="138.0" x2="628" y2="138.0" stroke="#6B7671" stroke-width="2"/>
<path d="M636,138.0 l-9,-5 l0,10 Z" fill="#6B7671"/>
<text x="334.0" y="128.0" text-anchor="middle" font-size="12.5" fill="#6B7671">&#215;</text>
<text x="612.0" y="128.0" text-anchor="middle" font-size="12.5" fill="#6B7671">&#247; P(E)</text>
<path d="M751.0,186 L751.0,242 L195.0,242 L195.0,195" fill="none" stroke="#B4341F" stroke-width="2" stroke-dasharray="6 4"/>
<path d="M195.0,186 l-5,9 l10,0 Z" fill="#B4341F"/>
<text x="473.0" y="264" text-anchor="middle" font-size="13.5" font-weight="700" fill="#B4341F">arriva un nuovo dato: la posterior diventa la nuova prior</text>
<text x="40" y="326" font-size="13.5" fill="#6B7671">Se non so nulla in partenza, la prior &#232; uniforme: tutte le ipotesi hanno lo stesso peso e la somma fa 1.</text>
</svg>
