<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 360" width="1000" height="360" font-family="Inter, system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">
<rect width="1000" height="360" fill="#FFFFFF"/>
<text x="40" y="34" font-size="16" font-weight="700" fill="#232A28">L'evento osservato si spezza sulle ipotesi</text>
<rect x="90" y="80" width="276" height="220" fill="#2F6BD8" fill-opacity="0.06"/>
<rect x="366" y="80" width="324" height="220" fill="#C2571A" fill-opacity="0.06"/>
<rect x="90" y="80" width="600" height="220" fill="none" stroke="#232A28" stroke-width="2"/>
<line x1="366" y1="80" x2="366" y2="300" stroke="#B4341F" stroke-width="2.4"/>
<text x="106" y="106" font-size="16" font-weight="700" fill="#2F6BD8">H</text>
<text x="672" y="106" text-anchor="end" font-size="16" font-weight="700" fill="#C2571A">H&#772;</text>
<text x="672" y="286" text-anchor="end" font-size="14" font-weight="700" fill="#232A28">&#937;</text>
<ellipse cx="356" cy="194" rx="120" ry="66" fill="#22874C" fill-opacity="0.22" stroke="#22874C" stroke-width="2.4"/>
<text x="298" y="199" text-anchor="middle" font-size="14" font-weight="700" fill="#22874C">E &#8745; H</text>
<text x="418" y="199" text-anchor="middle" font-size="14" font-weight="700" fill="#22874C">E &#8745; H&#772;</text>
<text x="356" y="118" text-anchor="middle" font-size="15" font-weight="700" fill="#22874C">E</text>
<text x="730" y="110" font-size="13.5" font-weight="700" fill="#232A28">H e H&#772; coprono tutto &#937;</text>
<text x="730" y="132" font-size="13" fill="#6B7671">e non si sovrappongono.</text>
<text x="730" y="170" font-size="13.5" font-weight="700" fill="#22874C">Quindi E si divide in due</text>
<text x="730" y="192" font-size="13" fill="#6B7671">pezzi disgiunti, e le loro</text>
<text x="730" y="211" font-size="13" fill="#6B7671">probabilit&#224; si sommano.</text>
<text x="730" y="252" font-size="13.5" font-weight="700" fill="#232A28">P(E) = P(E&#8745;H) + P(E&#8745;H&#772;)</text>
<text x="40" y="344" font-size="13.5" fill="#6B7671">Condizionare a H vuol dire buttare via met&#224; del disegno e riscalare quello che resta perch&#233; il totale torni 1.</text>
</svg>
