<text x="830" y="200" text-anchor="middle" font-size="12.5" fill="#8A918C">A&#8745;C<tspan font-size="10" dy="4">4</tspan><tspan font-size="12.5" dy="-4"> = &#8709;</tspan></text>
<text x="500" y="345" text-anchor="middle" class="cp">la partizione taglia A in pezzi che non si sovrappongono e che, rimessi insieme, ricostruiscono A</text>
