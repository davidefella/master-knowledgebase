<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 392" width="1000" height="392" font-family="Inter, system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">
<rect width="1000" height="392" fill="#FFFFFF"/>
<text x="40" y="34" font-size="16" font-weight="700" fill="#232A28">Distribuzione uniforme su [a, b] &#8212; esempio con a = 3, b = 8</text>
<line x1="90" y1="290" x2="458" y2="290" stroke="#C3C9C4" stroke-width="1.5"/>
<line x1="90" y1="290" x2="90" y2="66" stroke="#C3C9C4" stroke-width="1.5"/>
<line x1="90" y1="290" x2="178" y2="290" stroke="#2F6BD8" stroke-width="3"/>
<line x1="178" y1="120" x2="342" y2="120" stroke="#2F6BD8" stroke-width="3.4"/>
<line x1="342" y1="290" x2="440" y2="290" stroke="#2F6BD8" stroke-width="3"/>
<line x1="178" y1="290" x2="178" y2="120" stroke="#2F6BD8" stroke-width="1.6" stroke-dasharray="4 3"/>
<line x1="342" y1="290" x2="342" y2="120" stroke="#2F6BD8" stroke-width="1.6" stroke-dasharray="4 3"/>
<rect x="178" y="120" width="164" height="170" fill="#2F6BD8" opacity=".14"/>
<text x="260" y="108" text-anchor="middle" font-size="14" font-weight="700" fill="#1B4FA8">1/(b&#8722;a) = 0,2</text>
<text x="260" y="205" text-anchor="middle" font-size="13" font-weight="700" fill="#1B4FA8">area = 1</text>
<text x="178" y="312" text-anchor="middle" font-size="13" font-weight="700" fill="#232A28">a = 3</text>
<text x="342" y="312" text-anchor="middle" font-size="13" font-weight="700" fill="#232A28">b = 8</text>
<text x="80" y="60" font-size="14" font-weight="700" fill="#2F6BD8">f(x)</text>
<text x="90" y="334" font-size="13.5" fill="#6B7671">Altezza costante: nessun valore &#232; pi&#249; probabile di un altro.</text>
<line x1="570" y1="290" x2="938" y2="290" stroke="#C3C9C4" stroke-width="1.5"/>
<line x1="570" y1="290" x2="570" y2="66" stroke="#C3C9C4" stroke-width="1.5"/>
<line x1="570" y1="290" x2="658" y2="290" stroke="#22874C" stroke-width="3"/>
<line x1="658" y1="290" x2="822" y2="100" stroke="#22874C" stroke-width="3.4"/>
<line x1="822" y1="100" x2="920" y2="100" stroke="#22874C" stroke-width="3"/>
<line x1="570" y1="100" x2="822" y2="100" stroke="#6B7671" stroke-width="1.2" stroke-dasharray="5 4"/>
<text x="560" y="100" dy=".35em" text-anchor="end" font-size="13" font-weight="700" fill="#232A28">1</text>
<text x="658" y="312" text-anchor="middle" font-size="13" font-weight="700" fill="#232A28">a = 3</text>
<text x="822" y="312" text-anchor="middle" font-size="13" font-weight="700" fill="#232A28">b = 8</text>
<text x="560" y="60" font-size="14" font-weight="700" fill="#22874C">F(x)</text>
<text x="570" y="334" font-size="13.5" fill="#6B7671">Sale come una retta: (x &#8722; a)/(b &#8722; a).</text>
<text x="40" y="372" font-size="13.5" fill="#6B7671">La densit&#224; &#232; piatta, la cumulativa &#232; la sua area accumulata da sinistra: una retta che va da 0 a 1.</text>
</svg>