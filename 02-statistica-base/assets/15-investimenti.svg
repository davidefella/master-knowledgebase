<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 400" width="1000" height="400" font-family="Inter, system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">
<rect width="1000" height="400" fill="#FFFFFF"/>
<text x="40" y="34" font-size="16" font-weight="700" fill="#232A28">Stesso valore atteso, rischio diverso &#8212; 500 &#8364; investiti</text>
<text x="90" y="66" font-size="14" font-weight="700" fill="#22874C">A &#8212; prudente</text>
<line x1="90" y1="290" x2="456" y2="290" stroke="#C3C9C4" stroke-width="1.5"/>
<line x1="266.7" y1="290" x2="266.7" y2="134" stroke="#6B7671" stroke-width="1.4" stroke-dasharray="4 3"/>
<text x="266.7" y="124" text-anchor="middle" font-size="13" font-weight="700" fill="#232A28">&#956; = 500</text>
<line x1="250.9" y1="290" x2="250.9" y2="140" stroke="#22874C" stroke-width="9" stroke-linecap="butt"/>
<text x="243.9" y="310" text-anchor="end" font-size="13" font-weight="700" fill="#232A28">450 &#8364;</text>
<line x1="282.5" y1="290" x2="282.5" y2="140" stroke="#22874C" stroke-width="9" stroke-linecap="butt"/>
<text x="289.5" y="310" text-anchor="start" font-size="13" font-weight="700" fill="#232A28">550 &#8364;</text>
<text x="90" y="124" font-size="12.5" fill="#6B7671">ogni esito ha p = 1/2</text>
<line x1="266.7" y1="334" x2="282.5" y2="334" stroke="#C2571A" stroke-width="2.2"/>
<line x1="266.7" y1="329" x2="266.7" y2="339" stroke="#C2571A" stroke-width="2.2"/>
<line x1="282.5" y1="329" x2="282.5" y2="339" stroke="#C2571A" stroke-width="2.2"/>
<text x="274.6" y="325" text-anchor="middle" font-size="13" font-weight="700" fill="#C2571A">&#963; = 50</text>
<text x="90" y="368" font-size="13.5" fill="#6B7671">Il risultato resta sempre vicino ai 500 &#8364;.</text>
<text x="570" y="66" font-size="14" font-weight="700" fill="#2F6BD8">B &#8212; rischioso</text>
<line x1="570" y1="290" x2="936" y2="290" stroke="#C3C9C4" stroke-width="1.5"/>
<line x1="746.7" y1="290" x2="746.7" y2="134" stroke="#6B7671" stroke-width="1.4" stroke-dasharray="4 3"/>
<text x="746.7" y="124" text-anchor="middle" font-size="13" font-weight="700" fill="#232A28">&#956; = 500</text>
<line x1="588.9" y1="290" x2="588.9" y2="140" stroke="#2F6BD8" stroke-width="9" stroke-linecap="butt"/>
<text x="581.9" y="310" text-anchor="end" font-size="13" font-weight="700" fill="#232A28">0 &#8364;</text>
<line x1="904.4" y1="290" x2="904.4" y2="140" stroke="#2F6BD8" stroke-width="9" stroke-linecap="butt"/>
<text x="911.4" y="310" text-anchor="start" font-size="13" font-weight="700" fill="#232A28">1000 &#8364;</text>
<text x="570" y="124" font-size="12.5" fill="#6B7671">ogni esito ha p = 1/2</text>
<line x1="746.7" y1="334" x2="904.4" y2="334" stroke="#C2571A" stroke-width="2.2"/>
<line x1="746.7" y1="329" x2="746.7" y2="339" stroke="#C2571A" stroke-width="2.2"/>
<line x1="904.4" y1="329" x2="904.4" y2="339" stroke="#C2571A" stroke-width="2.2"/>
<text x="825.6" y="325" text-anchor="middle" font-size="13" font-weight="700" fill="#C2571A">&#963; = 500</text>
<text x="570" y="368" font-size="13.5" fill="#6B7671">O si perde tutto, o si raddoppia.</text>
<text x="40" y="392" font-size="13.5" fill="#6B7671">Il valore atteso non distingue i due casi: serve la varianza, che misura quanto &#232; larga la distribuzione.</text>
</svg>
