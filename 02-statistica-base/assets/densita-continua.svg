<text x="40" y="424" font-size="13.5" fill="#6B7671">Stringendo la fascia attorno ad a l&#8217;area tende a zero: la probabilit&#224; di un singolo valore esatto &#232; 0.</text>
<text x="40" y="450" font-size="13.5" fill="#6B7671">Ha senso solo chiedere la probabilit&#224; di un intervallo. Per questo f(x) si chiama densit&#224; e non probabilit&#224;.</text>
