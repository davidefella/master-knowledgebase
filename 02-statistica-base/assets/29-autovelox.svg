<text x="40" y="362" font-size="13.5" fill="#6B7671">Lo strumento sbaglia: &#963; = 2 km/h su ogni misura, quindi &#963;/&#8730;3 &#8776; 1,15 sulla media di tre.</text>
<text x="40" y="384" font-size="13.5" fill="#6B7671">La soglia si alza di 1,9 km/h per essere sicuri al 95% di non multare chi era davvero nei limiti.</text>
